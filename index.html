<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madiba's Thrift Closet | Style Reborn</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0f0a07;
            --card-tan: #c2884c;
            --card-border: #4d2309;
            --gold-accent: #e5a43b;
            --text-light: #f5eedc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(rgba(229, 164, 59, 0.05) 1px, transparent 0),
                radial-gradient(rgba(229, 164, 59, 0.05) 1px, var(--bg-dark) 1px);
            background-size: 30px 30px;
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            padding-bottom: 60px;
        }

        .tribal-bar {
            height: 18px;
            background: repeating-linear-gradient(
                45deg,
                #da7b27,
                #da7b27 12px,
                #111 12px,
                #111 24px,
                #e5a43b 24px,
                #e5a43b 36px
            );
            border-bottom: 2px solid #000;
        }

        header {
            background-color: #0b0705;
            text-align: center;
            border-bottom: 2px solid var(--gold-accent);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            max-width: 1300px;
            margin: 0 auto;
        }

        .logo-wrapper {
            text-align: center;
            margin: 5px 0;
            flex-grow: 1;
        }

        .logo-placeholder {
            max-width: 420px;
            max-height: 180px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            display: block;
            object-fit: contain;
        }

        .header-icons {
            display: flex;
            gap: 20px;
            font-size: 1.3rem;
            color: var(--gold-accent);
        }

        .header-icons a {
            color: var(--gold-accent);
            text-decoration: none;
        }

        nav {
            background: rgba(0, 0, 0, 0.7);
            border-top: 1px solid rgba(229, 164, 59, 0.2);
            padding: 12px 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            transition: color 0.3s;
            text-transform: uppercase;
        }

        nav a.active, nav a:hover {
            color: var(--gold-accent);
        }

        /* Hero Banner */
        .hero-banner {
            text-align: center;
            padding: 70px 20px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero-banner h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            color: var(--gold-accent);
            letter-spacing: 4px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 5px;
        }

        .hero-banner h2 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: #fff;
            letter-spacing: 3px;
        }

        .hero-banner .subtitle {
            font-size: 1.1rem;
            letter-spacing: 4px;
            color: #bbb;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .spear-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 25px 0;
            gap: 15px;
        }

        .spear-divider .line {
            height: 2px;
            width: 120px;
            background: linear-gradient(90deg, transparent, var(--gold-accent), transparent);
        }

        .cta-btn {
            display: inline-block;
            background: var(--gold-accent);
            color: #000;
            font-weight: bold;
            padding: 14px 32px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 25px;
            transition: all 0.3s;
        }

        .cta-btn:hover {
            background: #d4912a;
            transform: translateY(-2px);
        }

        /* Featured Preview Section */
        .featured-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: var(--gold-accent);
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .featured-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .product-card {
            background-color: var(--card-tan);
            border: 4px solid var(--card-border);
            border-radius: 4px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* FIX: Removed white background and set object-fit cover */
        .product-image-box {
            background: #140d09;
            border-radius: 4px;
            overflow: hidden;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            background: #b57a3e;
            margin-top: 10px;
            padding: 10px 8px;
            border-radius: 4px;
            border: 1px solid #7a4214;
        }

        .product-title {
            color: #1a0d05;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .product-price {
            color: #000;
            font-weight: 900;
            font-size: 1.2rem;
            font-family: 'Cinzel', serif;
        }

        .footer-widget-area {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 99;
        }

        .whatsapp-banner {
            background: rgba(18, 18, 18, 0.95);
            border: 2px solid var(--gold-accent);
            padding: 10px 15px;
            border-radius: 6px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .whatsapp-banner p {
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .wa-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #e5a43b;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .featured-grid { grid-template-columns: 1fr; }
            .hero-banner h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="tribal-bar"></div>

    <header>
        <div class="header-top">
            <div style="width: 50px;"></div>
            <div class="logo-wrapper">
                <a href="index.html"><img src="logo.jpg" alt="Madiba's Thrift Closet Logo" class="logo-placeholder"></a>
            </div>
            <div class="header-icons">
                <a href="catalog.html"><i class="fa-solid fa-magnifying-glass"></i></a>
                <a href="catalog.html"><i class="fa-solid fa-basket-shopping"></i></a>
            </div>
        </div>

        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero-banner">
        <h1>MADIBA'S</h1>
        <h2>THRIFT CLOSET</h2>
        <div class="subtitle">STYLE REBORN</div>
        
        <div class="spear-divider">
            <div class="line"></div>
            <i class="fa-solid fa-shield-halved" style="color: var(--gold-accent);"></i>
            <div class="line"></div>
        </div>

        <a href="catalog.html" class="cta-btn">Shop The Collection <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i></a>
    </section>

    <!-- Featured Section Preview -->
    <div class="featured-container">
        <div class="section-title">FEATURED PIECES</div>
        <div class="featured-grid">
            <div class="product-card">
                <div class="product-image-box">
                    <img src="m1.jpg" alt="Featured Piece 1" onerror="this.src='logo.jpg'">
                </div>
                <div class="product-info">
                    <div class="product-title">Premium Piece M1</div>
                    <div class="product-price">K150</div>
                </div>
            </div>
            <div class="product-card">
                <div class="product-image-box">
                    <img src="m2.jpg" alt="Featured Piece 2" onerror="this.src='logo.jpg'">
                </div>
                <div class="product-info">
                    <div class="product-title">Premium Piece M2</div>
                    <div class="product-price">K150</div>
                </div>
            </div>
            <div class="product-card">
                <div class="product-image-box">
                    <img src="m3.jpg" alt="Featured Piece 3" onerror="this.src='logo.jpg'">
                </div>
                <div class="product-info">
                    <div class="product-title">Premium Piece M3</div>
                    <div class="product-price">K150</div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-widget-area">
        <div class="whatsapp-banner">
            <p>Contact & Direct Order<br>via WhatsApp</p>
            <a href="https://wa.me/260973835473" target="_blank" class="wa-link">
                <i class="fa-brands fa-whatsapp" style="color: #25d366; font-size: 1.2rem;"></i> @madibascloset
            </a>
        </div>
    </div>

</body>
</html>
